# Development overrides — automatically merged with docker-compose.yml
# Removes the stale `target: development` reference and aligns with Dockerfile.dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      # No multi-stage target — Dockerfile.dev is a single-stage dev image
    environment:
      NODE_ENV: development
      DEBUG: "cps-store:*"
    stdin_open: true
    tty: true

  # Disable nginx in development (no SSL needed locally)
  nginx:
    profiles:
      - production
