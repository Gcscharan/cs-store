# ─── VyaparSetu — Development Docker Compose ──────────────────────────────────
#
# Services:
#   backend   — Node/TypeScript API (hot-reload via ts-node-dev)
#   mongodb   — Local MongoDB replica set (required for transactions)
#   redis     — Redis 7 (queues, caching, rate-limiting)
#
# Usage:
#   docker-compose up --build          # first run
#   docker-compose up                  # subsequent runs
#   docker-compose down -v             # stop + wipe volumes
#
# The backend connects to MongoDB and Redis using Docker service names,
# NOT localhost. See MONGODB_URI and REDIS_URL below.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  # Runs as a single-node replica set so Mongoose transactions work.
  # The replica set is initialised by the mongo-rs-init container below.
  mongodb:
    image: mongo:7.0
    container_name: vyaparsetu-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - vyaparsetu-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MongoDB Replica Set Initialiser ─────────────────────────────────────────
  # Runs once after mongodb is healthy, initiates rs0, then exits.
  mongo-init:
    image: mongo:7.0
    container_name: vyaparsetu-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vyaparsetu-network
    entrypoint: >
      mongosh --host mongodb:27017 --quiet --eval "
        try {
          rs.status();
          print('Replica set already initialised.');
        } catch(e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
          print('Replica set rs0 initiated.');
        }
      "

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vyaparsetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vyaparsetu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vyaparsetu-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5002}:${PORT:-5002}"
    env_file:
      - ./backend/.env
    environment:
      # Override DB/cache URLs to use Docker service names instead of localhost
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB_NAME:-cps-store}?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5002}
    volumes:
      # Mount only source code — keeps container's node_modules intact
      # This prevents the host's node_modules from overwriting the container's
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - vyaparsetu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5002}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  vyaparsetu-network:
    driver: bridge
